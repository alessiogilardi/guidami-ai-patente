# Delta over configs/ingestor_config.yaml, passed as `IngestorConfig(**overrides)`
# (highest-precedence init_settings) via `ingest --config`. Only the fields that
# differ from the base yaml are listed here — everything else (sources, postgres,
# embedding, table names, rca_ranges, ...) is still inherited from the base yaml,
# so there is nothing else to keep in sync (see ADR 0006).
layers:
  parsed: data/test-data/parsed
  cleaned: data/test-data/cleaned
  enriched: data/test-data/enriched

quiz_images_dir: data/test-data/parsed/quiz-patente-ab/images
