layers:
  parsed: data/parsed
  cleaned: data/cleaned
  enriched: data/enriched

sources:
  cds:
    dir: cds
    file: codice_della_strada.json
  cap:
    dir: cap
    file: codice_rca.json
  reg:
    dir: reg
    file: regolamento_attuazione.json
  amb:
    dir: amb
    file: codice_ambiente_rifiuti.json
  quiz:
    dir: quiz-patente-ab
    file: quiz-patente-ab.json

knowledge_preparation:
  input_layer: parsed
  output_layer: cleaned
  sources: [cds, cap, reg, amb]

knowledge_indexing:
  input_layer: cleaned
  sources: [cds, cap, reg, amb]

quiz_preparation:
  input_layer: parsed
  output_layer: enriched
  sources: [quiz]

quiz_indexing:
  input_layer: enriched
  sources: [quiz]

agents_dir: configs/agents
quiz_images_dir: data/quiz-images

embedding_batch_size: 8
embedding:
  model_name: openrouter/openai/text-embedding-3-small
  vector_dim: 1536
postgres:
  host: localhost
  port: 5432
  dbname: guidami_ai_patente
articles_table: articles
article_commas_table: article_commas
quiz_questions_table: quiz_questions
quiz_question_embeddings_table: quiz_question_embeddings
quiz_images_table: quiz_images
embed_repealed: false
rca_ranges: ["118-165", "278-300"]
amb_ranges: ["227-237"]

evaluation:
  seed: 42
  baseline_repetitions: 3
  k_values: [1, 3, 5, 10]
  keyword_df_cutoffs: [1, 2, 3, 5, 10, 20, 50, 100, 250, 500]
  text_coverage_thresholds: [0.01, 0.02, 0.05, 0.10]
  quiz_embedding_variant: search_queries
  output_dir: data/eval
