layers:
  parsed: data/parsed
  cleaned: data/cleaned
  enriched: data/enriched

sources:
  cds:
    dir: cds
    file: codice_della_strada.json
  cap:
    dir: cap
    file: codice_rca.json
  quiz:
    dir: quiz-patente-ab
    file: quiz-patente-ab.json

knowledge_preparation:
  input_layer: parsed
  output_layer: enriched
  sources: [cds, cap]

knowledge_indexing:
  input_layer: enriched
  sources: [cds, cap]

quiz_preparation:
  input_layer: cleaned
  output_layer: enriched
  sources: [quiz]

quiz_indexing:
  input_layer: enriched
  sources: [quiz]

agents_dir: configs/agents
quiz_images_dir: data/cleaned/quiz-patente-ab/images

embedding_batch_size: 8
embedding:
  model_name: openrouter/openai/text-embedding-3-small
  vector_dim: 1536
postgres:
  host: localhost
  port: 5432
  dbname: guidami_ai_patente
knowledge_chunks_table: knowledge_chunks
quiz_questions_table: quiz_questions
embed_repealed: false
