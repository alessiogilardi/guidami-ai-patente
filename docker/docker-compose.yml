services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guidami}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guidami}
      POSTGRES_DB: ${POSTGRES_DB:-guidami_ai_patente}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
