[project]
name = "guidami-ai-patente"
version = "0.1.0"
description = "Quiz bot and RAG pipeline over Italian driving exam corpus (CdS + CAP)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pdfplumber>=0.11.9",
    "pillow>=10.0.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.14.1",
    "pymupdf>=1.27.2.3",
    "litellm>=1.80.15",
    "sentence-transformers>=5.5.1",
    "pydantic-ai-slim[openrouter]>=1.107.0",
    "aiofiles>=25.1.0",
    "flowstep",
    "rich>=13",
]

[project.scripts]
scrape-codice      = "scrapers.normattiva:main_cds"
scrape-cap         = "scrapers.normattiva:main_cap"
extract-rca        = "scrapers.rca_extract:main"
parse-domande      = "parsers.questions_pdf:main_questions"
ingest             = "guidami_ai_patente_ingestor.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
flowstep = { git = "https://github.com/alessiogilardi/flowstep.git", branch = "main" }

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# E, F = PEP8, I = isort, G = logging, D = docstring, UP = modernization,
# SIM = simplify (flags over-complicated constructs), C901 = cyclomatic complexity
select = ["E", "F", "I", "G", "D", "UP", "SIM", "C901"]
ignore = [
    "D100", # missing-module-docstring
    "G004", # logging-fstring-interpolation
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names are self-explanatory, no docstrings required.
"tests/**" = ["D101", "D102", "D103"]
"**/__init__.py" = ["D104"]
# scrapers/parsers are one-shot script entry points: cyclomatic complexity of their
# top-level orchestration is low-value to enforce (same spirit as the TDD exemption
# for scripts). C901 stays active for commons/ and the ingestor.
"src/scrapers/**" = ["C901"]
"src/parsers/**" = ["C901"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (Postgres, model downloads, ...)",
]

[tool.pyright]
include = ["src"]
# Analysis settings
typeCheckingMode = "standard"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
# Excludes type checking on installed external dependencies
reportMissingImports = "none"
