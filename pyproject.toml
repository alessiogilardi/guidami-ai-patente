[project]
name = "guidami-ai-patente"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "pdfplumber>=0.11.9",
    "pillow>=10.0.0",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings[yaml]>=2.14.1",
    "pymupdf>=1.27.2.3",
    "litellm>=1.80.15",
    "sentence-transformers>=5.5.1",
    "pydantic-ai-slim[openrouter]>=1.107.0",
]

[project.scripts]
scrape-codice      = "scrapers.normattiva:main_cds"
scrape-cap         = "scrapers.normattiva:main_cap"
parse-domande      = "parsers.questions_pdf:main_questions"
prepare-knowledge  = "guidami_ai_patente_ingestor.prepare_knowledge_main:main"
prepare-quiz       = "guidami_ai_patente_ingestor.quiz_preparation_main:main"
ingest-knowledge   = "guidami_ai_patente_ingestor.main:main"
reset-knowledge-db = "guidami_ai_patente_ingestor.reset_db:main"
ingest-quiz        = "guidami_ai_patente_ingestor.quiz_main:main"
reset-quiz-db      = "guidami_ai_patente_ingestor.reset_quiz_db:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
# E, F = PEP8, I = isort, G = logging, D = docstring, UP = modernizzazione
select = ["E", "F", "I", "G", "D", "UP"]
ignore = [
    "D100", # missing-module-docstring
    "G004", # logging-fstring-interpolation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Nomi dei test sono autoesplicativi, niente docstring richieste.
"tests/**" = ["D101", "D102", "D103"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require external services (Postgres, model downloads, ...)",
]

[tool.pyright]
include = ["src"]
# Impostazioni di analisi
typeCheckingMode = "standard"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
# Esclude il controllo dei tipi sulle dipendenze esterne installate
reportMissingImports = "none"
